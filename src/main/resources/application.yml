server:
  port: 8082

spring:
  application:
    name: main-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cache:
    type: simple
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "http.server.requests": true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

publication:
  scheduler:
    publish-cron: "0 0,15,30,45 * * * *"

app:
  outbox:
    batch-size: 100
    dispatch-cron: "0 */1 * * * *"
  kafka:
    topics:
      hero-bug-report-created: hero-bug-report-created
  publications:
    page-size-default: 10
    page-size-max: 50
  cache:
    ttl:
      hero-page: 10m
      hero-lookups: 30m
      hero-filters: 1h
      hero-details: 30m
      hero-opinions: 30m
      hero-coach: 30m
      outfitter: 30m
      publications: 15m

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:${spring.application.name}@local}
  send-default-pii: false
