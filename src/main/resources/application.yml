server:
  port: 8082

spring:
  application:
    name: main-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

publication:
  scheduler:
    publish-cron: "0 0,15,30,45 * * * *"

app:
  media-migration:
    enabled: false
    dry-run: true
    limit: 100
