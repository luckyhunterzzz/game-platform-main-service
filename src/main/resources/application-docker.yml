spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://postgres:5432/main_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  kafka:
    topics:
      hero-bug-report-created: ${APP_KAFKA_TOPIC_HERO_BUG_REPORT_CREATED:hero-bug-report-created}
  minio:
    endpoint: http://minio:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    public-base-url: ${APP_MINIO_PUBLIC_BASE_URL}
    ru-public-base-url: ${APP_MINIO_RU_PUBLIC_BASE_URL:https://ru-media.gameops-platform.dev}
    bucket: game-content
    secure: false

  publications:
    page-size-default: ${APP_PUBLICATIONS_DEFAULT_PAGE_SIZE:10}
    page-size-max: ${APP_PUBLICATIONS_MAX_PAGE_SIZE:50}
